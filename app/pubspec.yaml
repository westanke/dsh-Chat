name: dshchat
description: "DSH Chat mobile client for dsh-remote-bridge (Android / iOS / HarmonyOS)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.41+42

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # 持久化 bridge 凭证（baseUrl+token），实现「一次配对，此后自动连接」。
  # 走 CPF-Flutter 的 facade：只有这个分支的 plugin platforms 才带 ohos 实现
  # （pub.dev 版的 platforms 里没有 ohos，鸿蒙端会找不到实现）。
  shared_preferences: ^2.3.0
  flutter:
    sdk: flutter

  # 中文本地化（真机反馈 2026-11-04 第二轮 D）：TextField 长按粘贴/选择菜单中文。
  flutter_localizations:
    sdk: flutter

  # Markdown 渲染（官方 flutter_markdown 已废弃，社区流式聊天首选）。
  # 本地副本 vendor/gpt_markdown：上游 1.4.1 的穷尽 switch 缺 TargetPlatform.ohos
  # 分支，鸿蒙目标编译不过；补丁只有一行，详见 vendor/gpt_markdown/README.dsh.md。
  gpt_markdown: ^1.4.0
  # 语法高亮：官方 App 用 Atom One Light，gpt_markdown 内置主题配色不同，
  # 自写 codeBuilder 时直接用这套（本就是 gpt_markdown 的传递依赖）。
  val_highlight: ^0.1.1
  val_highlight_flutter: ^0.1.1
  # bridge 连接
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  # WS 附件上传（file-upload-open 帧）要求本地给 sha256，桥据此校验完整性。
  crypto: ^3.0.0
  # 会话内链接跳转（真机反馈第四轮 5）：外接浏览器打开，零 UI 依赖。
  url_launcher: ^6.3.0

  # Flutter 3.50 拆包：Material/Cupertino 组件库独立发布（dart fix 自动加
  # 的 any 锁不住版本，显式 pin 到迁移时最新）。
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

# 鸿蒙适配覆盖（2026-11-25 落地，见 docs/STRUCTURE.md 与 AGENTS.md §3）：
#
#   三端共用同一份 Dart 代码，但「包来源」必须换成带 ohos 适配的那份：
#
#   1) material_ui / cupertino_ui —— pub.dev 版有 62/90 处穷尽
#      `switch (platform)`，全缺 TargetPlatform.ohos 分支，鸿蒙目标上
#      直接编译失败。CPF-Flutter 的 flutter_packages 分支 oh-3.47.7-dev
#      带 ohos 适配（62 处 switch 全部补了 ohos 分支）。
#      代价：Android/iOS 也用这份 1.9.0，少了 pub.dev 1.10/1.11 的若干修复
#      （Checkbox.markInsets、Material 3 Expressive spring tokens、
#      Dialog.fullscreen 键盘遮挡修复等）。等 CPF 出 1.11-ohos 再评估。
#
#   2) shared_preferences / url_launcher —— pub.dev 版的 plugin platforms
#      里没有 ohos，鸿蒙端无实现。CPF facade 版的 platforms 带
#      `ohos: default_package: <plugin>_ohos`，且会自动把实现包带进依赖树。
#
#   3) gpt_markdown —— 上游穷尽 switch 缺 ohos 分支，走本地 vendor 副本
#      （只打一行补丁，见 vendor/gpt_markdown/README.dsh.md）。
#
#   用 dependency_overrides 而不是改 dependencies 的原因：gpt_markdown 与
#   val_highlight_flutter 都对 material_ui 有 hosted 源的版本约束
#   （^1.3.0 / ^1.0.1），直接改主依赖会与传递依赖的 hosted 源冲突导致
#   version solving failed。override 能把整棵树统一到 git 源。
dependency_overrides:
  material_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/material_ui
      ref: oh-3.47.7-dev
  cupertino_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/cupertino_ui
      ref: oh-3.47.7-dev
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: oh-3.47.7-dev
  url_launcher:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: oh-3.47.7-dev
  gpt_markdown:
    path: vendor/gpt_markdown

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

