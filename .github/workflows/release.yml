name: Release

# 发版构建（ci.yml 只做门禁不构建；产物从这里出）。
# 触发：
#   - 打 tag（约定 v<versionName>，如 v1.0.14；versionCode 在 pubspec.yaml 里 +1）
#   - 或手动 workflow_dispatch（试跑/重跑）
# 产物为 workflow artifact（私有仓库登录 GitHub 后在 Actions 页下载）：
#   - android：arm64-v8a universal APK（build.gradle.kts 已砍 32 位与 x86_64）
#   - ios：未签名 IPA（本机无苹果环境；侧载工具 Sideloadly/AltStore/爱思助手安装）
#     CI 里 --no-codesign 构建，未签名不能直接 Xcode 分发，但足够侧载签名。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意 flutter-action@v2 的参数名是 flutter-version（写 version 会被静默忽略）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 版本号核对（发版必须升版本）
        run: |
          VER=$(grep -oP '^version: \K.*' pubspec.yaml)
          echo "pubspec version=$VER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG}" != "$(echo "$VER" | cut -d+ -f1)" ]; then
              echo "::error::tag v$TAG 与 pubspec 版本 $VER 不一致（发版必须升级版本号并同步打 tag）"
              exit 1
            fi
          fi
          echo "APK_VERSION=$VER" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build apk --release

      - name: 重命名产物
        run: cp build/app/outputs/flutter-apk/app-release.apk "dshchat-${APK_VERSION/+/_}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dshchat-*-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 版本号核对（发版必须升版本）
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//')
          echo "pubspec version=$VER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG}" != "$(echo "$VER" | cut -d+ -f1)" ]; then
              echo "::error::tag v$TAG 与 pubspec 版本 $VER 不一致"
              exit 1
            fi
          fi
          echo "IPA_VERSION=$VER" >> "$GITHUB_ENV"

      - run: flutter pub get

      # 无签名构建（无证书）；Podfile 平台版本由 flutter 生成
      - run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dshchat-${IPA_VERSION/+/_}-ios-unsigned.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dshchat-*-ios-unsigned.ipa
          if-no-files-found: error
