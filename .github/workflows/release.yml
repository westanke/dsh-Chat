name: Release

# 发版构建（ci.yml 只做门禁不构建；产物从这里出）。
# 触发：
#   - 打 tag（约定 v<versionName>，如 v1.0.14；versionCode 在 pubspec.yaml 里 +1）
#   - 或手动 workflow_dispatch（试跑/重跑）
# 产物为 workflow artifact（私有仓库登录 GitHub 后在 Actions 页下载）：
#   - android：arm64-v8a APK（build.gradle.kts 已砍 32 位与 x86_64）
#   - ios：未签名 IPA（macos-15 arm64 runner；--no-codesign，侧载工具签名后安装）
#   - harmony：可选 job，只有配置了 self-hosted runner + vars.BUILD_HAP=true 才跑
#     （GitHub 托管 runner 没有 7GB 的 HarmonyOS SDK；本机 HAP 走 scripts/release.sh）
#
# 三个 job 都必须用 Flutter-OH，不能用 subosito/flutter-action 的上游 3.50.0：
# material_ui/cupertino_ui 是 CPF ohos fork，代码里有 TargetPlatform.ohos，
# 上游 SDK 没有这个枚举，Android/iOS 都会在编译期失败。
# iOS 引擎工件（engine.version 371f77202a）在 Google Flutter storage 有
# ios/artifacts.zip 与 ios-release/artifacts.zip；macOS 宿主工件也有
# darwin-arm64/artifacts.zip。OH-Flutter 只发 darwin-arm64 定制 Dart SDK，
# 所以 iOS job 必须用 Apple Silicon runner（macos-15）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 引导 Flutter-OH SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/setup-flutter-oh.sh

      - name: 版本号核对（发版必须升版本）
        run: |
          VER=$(grep -oP '^version: \K.*' app/pubspec.yaml)
          echo "pubspec version=$VER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG}" != "$(echo "$VER" | cut -d+ -f1)" ]; then
              echo "::error::tag v$TAG 与 pubspec 版本 $VER 不一致（发版必须升级版本号并同步打 tag）"
              exit 1
            fi
          fi
          echo "APK_VERSION=$VER" >> "$GITHUB_ENV"

      - run: flutter pub get
        working-directory: app

      - name: 配置发布签名（仓库 Secrets 注入，签名不一致修复 2026-11-15）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/android/dshchat-release.jks
            {
              printf 'storeFile=dshchat-release.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > app/android/key.properties
            echo "release keystore 已注入"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 等 Secrets，回落 debug 签名"
          fi

      - run: flutter build apk --release --target-platform android-arm64
        working-directory: app

      - name: 重命名产物
        run: cp app/build/app/outputs/flutter-apk/app-release.apk "dshchat-${APK_VERSION/+/_}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dshchat-*-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    # macos-15 是 Apple Silicon（arm64）；OH-Flutter 只发 darwin-arm64 定制 Dart SDK。
    # 不要改成 macos-13 / macos-15-intel（x64 没有定制 Dart SDK，bootstrap 会报 ohosArm）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 确认 Apple Silicon runner
        run: |
          arch="$(uname -m)"
          echo "runner arch=$arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::iOS job 需要 arm64 macOS runner（OH-Flutter 无 darwin-x64 定制 Dart SDK）"
            exit 1
          fi

      - name: 引导 Flutter-OH SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/setup-flutter-oh.sh

      - name: 版本号核对（发版必须升版本）
        run: |
          VER=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *//')
          echo "pubspec version=$VER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG}" != "$(echo "$VER" | cut -d+ -f1)" ]; then
              echo "::error::tag v$TAG 与 pubspec 版本 $VER 不一致"
              exit 1
            fi
          fi
          echo "IPA_VERSION=$VER" >> "$GITHUB_ENV"

      - run: flutter pub get
        working-directory: app

      # 无签名构建（无证书）；Podfile 平台版本由 flutter 生成。
      # 首次会从 storage.googleapis.com 拉 ios/ios-release 引擎（约 226MB），
      # 并跑 pod install；GitHub runner 需要 CocoaPods（macos-15 镜像自带）。
      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign
        working-directory: app

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry "dshchat-${IPA_VERSION/+/_}-ios-unsigned.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dshchat-*-ios-unsigned.ipa
          if-no-files-found: error

  # 可选：只有自建 runner（已装 HarmonyOS API 26 SDK）才跑。
  # 不配 vars.BUILD_HAP 时该 job 直接 skipped，不影响 Android/iOS 发版。
  # 本机发版仍以 scripts/release.sh 为准（会构建 HAP + 可选签名）。
  hap:
    name: HarmonyOS HAP (self-hosted, optional)
    if: ${{ vars.BUILD_HAP == 'true' }}
    runs-on: [self-hosted, linux, harmonyos]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 检查自建 runner 工具链
        run: |
          set -euo pipefail
          : "${FLUTTER_ROOT:?self-hosted runner 需要设置 FLUTTER_ROOT（指向 tools/flutter-oh）}"
          : "${DEVECO_SDK_HOME:?self-hosted runner 需要设置 DEVECO_SDK_HOME（API 26）}"
          "$FLUTTER_ROOT/bin/flutter" --version

      - name: 版本号核对
        run: |
          VER=$(grep -oP '^version: \K.*' app/pubspec.yaml)
          echo "HAP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: 构建 HAP（release, unsigned）
        run: |
          set -euo pipefail
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          cd app
          flutter pub get
          flutter build hap --release --no-codesign

      - name: 收集 HAP
        run: |
          set -euo pipefail
          src="app/build/ohos/hap/entry-default-unsigned.hap"
          [ -f "$src" ] || src="app/ohos/entry/build/default/outputs/default/entry-default-unsigned.hap"
          [ -f "$src" ] || { echo "::error::没有找到 HAP 产物"; exit 1; }
          cp "$src" "dshchat-${HAP_VERSION/+/_}-harmony-unsigned.hap"

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-hap
          path: dshchat-*-harmony-unsigned.hap
          if-no-files-found: error
