name: CI

# 与 dsh-remote-bridge / dsh-companion 的门禁口径一致：**静态检查 + 单测 + 文档契约**
# 跑绿才算可提交。差别在于本仓是 Flutter 应用：
#   - dsh-remote-bridge 的 `pnpm check` = typecheck → test → docs:check → build
#   - 本仓的等价物 = `flutter analyze` → `flutter test` → docs/STRUCTURE.md 契约检查
#
# 刻意**不**在 CI 里 `flutter build apk`（发版构建走 release.yml：tag 触发，
# 顺带出 iOS 未签名 IPA——本机无苹果环境）：
#   1) 真机构建需要 Android SDK + JDK17 + gradle 缓存，冷启动要十几分钟，
#      而门禁的验收动作是 analyze/test/docs-check，构建产出没人用；
#   2) 构建产物不入库，发版走 release.yml + artifact 下载。
#   真要加构建任务时，照 dsh-companion 的 android.yml 抄 setup-java/setup-android 三段。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连推时只保留最新一次，避免排队堆积（与模板仓一致）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 文档契约：零依赖，几秒跑完，放在前面当快速失败闸门 ──────────────────
  docs:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 宪法 AGENTS.md §8 要求「改了 lib/ 就在同一提交里改 docs/STRUCTURE.md」。
      # 人肉记不住，所以做成机检 —— 这是模板仓 `pnpm docs:check` 在本仓的等价物。
      - name: 文档契约（STRUCTURE.md 覆盖全部 lib/ 文件、无死链、无旧仓名）
        run: bash scripts/ci/docs-check.sh

  # ── Flutter 门禁：静态分析 + 单测 ────────────────────────────────────
  # 用 **Flutter-OH**（atomgit.com/oh-flutter/flutter_flutter），不是上游 stable：
  #   2026-11-25 教训 —— material_ui/cupertino_ui 已切 CPF ohos fork（AGENTS.md §11
  #   `material_ui 穷尽 switch`），fork 里有 72+17 处 `TargetPlatform.ohos`；
  #   上游 Flutter 3.50.0 的 TargetPlatform 没这个常量，本仓与 vendor/gpt_markdown
  #   合计 89 处引用直接编译失败。**三端必须统一用 Flutter-OH**，CI 也不例外。
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app   # Flutter 工程根在 app/，pubspec.yaml 在那里
    steps:
      - uses: actions/checkout@v4

      # SDK 里最大的两块（定制 Dart SDK + flutter_tester 引擎工件）按版本号缓存，
      # 命中时省掉约 1.5 GB 下载；必须在 setup 之前 restore，否则先下载再缓存等于没缓存。
      - uses: actions/cache@v4
        with:
          path: ~/flutter-oh/bin/cache
          key: flutter-oh-3.50.0+ohos-1.3.3-${{ runner.os }}-${{ hashFiles('app/pubspec.lock', 'scripts/ci/setup-flutter-oh.sh') }}

      # Flutter-OH SDK 是 git 仓库不是官方发布包，只能自己 clone。
      # 版本口径：3.50.0+ohos-1.3.3（stable 线，OH-Flutter 官方发布；CPF 先锋版不要上生产）。
      # 脚本同时补 linux-x64 定制 Dart SDK 与 AOT gen_snapshot（Dart 3.14.0），
      # 否则 `flutter test` 报 Member not found: 'ohosArm'，HAP release 报 kernel 130/141。
      - name: 引导 Flutter-OH SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/setup-flutter-oh.sh

      - name: 打印工具链版本（排障用）
        run: |
          export FLUTTER_ROOT="$HOME/flutter-oh"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter --version
          dart --version

      - name: 依赖还原
        run: |
          export FLUTTER_ROOT="$HOME/flutter-oh"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter pub get

      - name: 静态分析
        run: |
          export FLUTTER_ROOT="$HOME/flutter-oh"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter analyze

      - name: 单元测试
        run: |
          export FLUTTER_ROOT="$HOME/flutter-oh"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter test
